[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-ai"
version = "0.1.0"
description = "Local-first coordinator and node client for Mycelium AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["coordinator*", "node_client*", "desktop_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
